name: Update README stats SVGs

on:
  schedule:
    # Daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-stats.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      USERNAME: Sec-ant
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate stats card (light)
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1.2.0
        with:
          card: stats
          options: username=${{ env.USERNAME }}&count_private=true&show_icons=true&bg_color=ffffff00&hide_border=true&theme=default
          path: assets/stats-light.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate stats card (dark)
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1.2.0
        with:
          card: stats
          options: username=${{ env.USERNAME }}&count_private=true&show_icons=true&bg_color=ffffff00&hide_border=true&theme=onedark
          path: assets/stats-dark.svg
          token: ${{ secrets.GH_PAT }}

      - name: Fetch trophy SVGs (public API, no auth needed)
        run: |
          set -euo pipefail
          mkdir -p assets

          fetch() {
            local url="$1" out="$2"
            for i in 1 2 3 4 5; do
              if curl -fsSL --max-time 30 -o "$out.tmp" "$url"; then
                mv "$out.tmp" "$out"
                return 0
              fi
              echo "  attempt $i failed, retrying in $((i * 5))s..."
              sleep $((i * 5))
            done
            echo "Failed to fetch $url"
            rm -f "$out.tmp"
            return 1
          }

          base="https://github-profile-trophy.vercel.app/?username=${USERNAME}&row=2&column=4&margin-w=8&margin-h=54&no-bg=true&no-frame=true"
          fetch "${base}&theme=flat"    assets/trophy-light.svg
          fetch "${base}&theme=onedark" assets/trophy-dark.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update README stats SVGs"
            git push
          fi
