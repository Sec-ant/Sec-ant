name: Update README stats SVGs

on:
  schedule:
    # Daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-stats.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      USERNAME: Sec-ant
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate stats card (light)
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1.2.0
        with:
          card: stats
          options: username=${{ env.USERNAME }}&count_private=true&show_icons=true&bg_color=ffffff00&hide_border=true&theme=default
          path: assets/stats-light.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate stats card (dark)
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1.2.0
        with:
          card: stats
          options: username=${{ env.USERNAME }}&count_private=true&show_icons=true&bg_color=ffffff00&hide_border=true&theme=onedark
          path: assets/stats-dark.svg
          token: ${{ secrets.GH_PAT }}

      - name: Fetch trophy SVGs (public API, no auth needed)
        run: |
          set -euo pipefail
          mkdir -p assets

          fetch() {
            local url="$1" out="$2"
            for i in 1 2 3 4 5; do
              if curl -fsSL --max-time 30 -o "$out.tmp" "$url"; then
                mv "$out.tmp" "$out"
                return 0
              fi
              echo "  attempt $i failed, retrying in $((i * 5))s..."
              sleep $((i * 5))
            done
            echo "Failed to fetch $url"
            rm -f "$out.tmp"
            return 1
          }

          base="https://github-profile-trophy.vercel.app/?username=${USERNAME}&row=2&column=4&margin-w=8&margin-h=54&no-bg=true&no-frame=true"
          fetch "${base}&theme=flat"    assets/trophy-light.svg
          fetch "${base}&theme=onedark" assets/trophy-dark.svg

      - name: Publish SVGs to `stats` branch
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          # Push to a dedicated orphan branch so:
          #  - daily commits don't pollute `main`'s git log
          #  - daily commits don't pollute the contribution graph
          #    (only default branch + gh-pages count toward the calendar)
          # Push events still count as repo activity, so the schedule
          # won't be auto-disabled after 60 days.

          WT_DIR="$(mktemp -d)"
          REPO_URL="https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"

          if git clone --depth 1 --branch stats --single-branch "$REPO_URL" "$WT_DIR" 2>/dev/null; then
            echo "Existing stats branch checked out"
          else
            echo "stats branch does not exist yet, creating as orphan"
            git clone --depth 1 --single-branch "$REPO_URL" "$WT_DIR"
            git -C "$WT_DIR" checkout --orphan stats
            git -C "$WT_DIR" rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p "$WT_DIR/assets"
          cp -f "$GITHUB_WORKSPACE"/assets/*.svg "$WT_DIR/assets/"

          # Drop a tiny README on the branch so visitors landing on
          # the branch URL aren't confused.
          cat > "$WT_DIR/README.md" <<'EOF'
          # stats branch

          Auto-generated SVGs consumed by the profile README on `main`.
          Do not edit manually — overwritten daily by `.github/workflows/update-stats.yml`.
          EOF

          cd "$WT_DIR"
          git config user.name "Sec-ant"
          git config user.email "10386119+Sec-ant@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update README stats SVGs"
          git push origin stats
